[package]
edition = "2024"
name = "tauri-sys"
version = "0.2.4"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
derive_more = { version = "2.1.1", features = ["deref", "from"] }
futures = { version = "0.3.34", optional = true }
js-sys = "0.3.104"
log = "0.4.34"
send_wrapper = { version = "0.6.0", features = ["futures"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_repr = "0.1.21"
thiserror = "2.0.20"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"

[dev-dependencies]
tauri-sys = { path = ".", features = ["all"] }
wasm-bindgen-test = "0.3.77"

[package.metadata.docs.rs]
all-features = true

[features]
all = ["app", "core", "dpi", "event", "menu", "window"]
app = ["core"]
core = ["dep:futures"]
dpi = []
event = ["dep:futures"]
menu = ["core", "window"]
window = ["dpi", "event"]
nightly = []

[workspace]
members = ["examples/leptos", "examples/leptos/src-tauri"]
